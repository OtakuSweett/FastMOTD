//file:noinspection GroovyAssignabilityCheck

plugins {
    id("java")
    id("checkstyle")
    id("com.github.spotbugs").version("6.4.8")
    id("org.cadixdev.licenser").version("0.6.1")
    id("com.gradleup.shadow").version("9.3.2") apply false
}

allprojects {
    group = "net.elytrium"
    version = "1.1.0"

    repositories {
        mavenCentral()
        maven {
            setName("papermc-repo")
            setUrl("https://repo.papermc.io/repository/maven-public/")
        }
    }
}

subprojects {
    apply plugin: "java"
    apply plugin: "checkstyle"
    apply plugin: "com.github.spotbugs"
    apply plugin: "org.cadixdev.licenser"

    java {
        setSourceCompatibility(JavaVersion.VERSION_21)
        setTargetCompatibility(JavaVersion.VERSION_21)
    }

    compileJava {
        getOptions().setEncoding("UTF-8")
    }

    license {
        setHeader(rootProject.file("HEADER.txt"))
    }

    checkstyle {
        setToolVersion("13.3.0")
        setConfigFile(rootProject.file("config/checkstyle/checkstyle.xml"))
        setConfigProperties("configDirectory": "${rootProject.rootDir}/config/checkstyle")
        setMaxErrors(0)
        setMaxWarnings(0)
    }

    spotbugsMain {
        setExcludeFilter(rootProject.file("config/spotbugs/suppressions.xml"))
        reports {
            html {
                getRequired().set(true)
                getOutputLocation().set(file("${buildDir}/reports/spotbugs/main/spotbugs.html"))
                setStylesheet("fancy-hist.xsl")
            }
        }
    }
}
